name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Source of truth: VENDOR_LOCK.md. v6.8.0, RESHADE_API_VERSION 20.
  RESHADE_SHA: 18deaa52de0c425a78b329e9cb3c497281cd00ec
  # NVIDIA/DLSS @ main, include/ only. Pinned at P1.0 and recorded in
  # VENDOR_LOCK.md and THIRD_PARTY.md; those three must agree.
  NGX_SHA: a291cc7d2cc642a51566f3dfd5376f635cd1b284

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The guard has been sequencing the remaining work all along, and each
      # milestone moves exactly the symbols it needs, in the same commit that
      # first legitimately uses them:
      #
      #   moved by P1.0  NVSDK_NGX  nvngx
      #   moved by P1.3  SHARED_CROSS_ADAPTER  HEAP_FLAG_SHARED
      #                  CreateSharedHandle    OpenSharedHandle
      #   moved by P1.5  reshade_finish_effects
      #   moved by P2.0  FENCE_FLAG_SHARED
      #   moved by P2.1  COMMAND_LIST_TYPE_COPY
      #   still guarded  GetClockCalibration               -> P2.2
      #
      # P2.0 bought the ordered handoff: a cross-adapter shared fence in place
      # of P1.5's frames-elapsed inference. P2.1 spends it - dedicated COPY
      # queues on both adapters and a banded ring, with GPU 1's queue waiting
      # on GPU 0's fence value on the GPU rather than the CPU blocking between
      # the two sides. That is the last structural change to the transport.
      #
      # ONE SYMBOL REMAINS AND IT IS THE IMPORTANT ONE. Every number this
      # project has produced is QPC wall-clock around a CPU-visible completion:
      # it contains queue latency and driver overhead as well as execution, and
      # the two adapters have never been read against a common clock. Until
      # GetClockCalibration moves in P2.2, nothing here is a performance figure
      # and the logs say so at every site that prints a duration. Widening this
      # pattern to make a build pass deletes the guard rather than moving it.
      - name: Containment check
        shell: bash
        run: |
          PATTERN='GetClockCalibration'
          FOUND=0
          for DIR in src assets; do
            [ -d "$DIR" ] || continue
            if grep -rnE "$PATTERN" "$DIR"; then FOUND=1; fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::Out-of-scope symbol: GetClockCalibration is still guarded (P2.2)"
            exit 1
          fi

      # Headers land FLATTENED at ext/reshade/reshade.hpp — that is the
      # path CMakeLists.txt adds as an include directory. Downloads stay
      # in the workspace; MSYS path translation makes /tmp unreliable here.
      - name: Fetch ReShade headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/reshade.tar.gz \
            "https://codeload.github.com/crosire/reshade/tar.gz/${RESHADE_SHA}"
          tar -xzf _dl/reshade.tar.gz -C _dl "reshade-${RESHADE_SHA}/include"
          rm -rf ext/reshade
          mv "_dl/reshade-${RESHADE_SHA}/include" ext/reshade
          test -f ext/reshade/reshade.hpp

      - name: Verify pin (RESHADE_API_VERSION 20)
        shell: bash
        run: |
          grep -q 'define RESHADE_API_VERSION 20' ext/reshade/reshade.hpp || {
            echo "::error::Pin drift - fetched tree does not define RESHADE_API_VERSION 20"
            exit 1
          }

      # NGX headers land FLATTENED at ext/ngx/nvsdk_ngx.h, mirroring the
      # ReShade layout. CMakeLists.txt is closed and gains no include
      # directory, so src/ reaches them with a quote include relative to
      # itself: #include "../ext/ngx/nvsdk_ngx.h".
      #
      # --wildcards rather than a hardcoded "DLSS-${NGX_SHA}/include":
      # codeload names the tarball root after the repository, and its
      # capitalisation is the one thing this step must not assume. The
      # glob extracts whatever the root is called.
      - name: Fetch NVIDIA NGX headers at pinned SHA
        shell: bash
        run: |
          mkdir -p _dl ext
          curl -fsSL -o _dl/ngx.tar.gz \
            "https://codeload.github.com/NVIDIA/DLSS/tar.gz/${NGX_SHA}"
          tar -xzf _dl/ngx.tar.gz -C _dl --wildcards "*/include"
          rm -rf ext/ngx
          mv _dl/*/include ext/ngx
          test -f ext/ngx/nvsdk_ngx.h
          test -f ext/ngx/nvsdk_ngx_defs.h
          test -f ext/ngx/nvsdk_ngx_params.h

      # nvsdk_ngx_d3d12.h does NOT exist in this tree — the D3D12 entry
      # points are declared in nvsdk_ngx.h itself. Do not add a test -f
      # for it; it will fail the build.
      #
      # A silently-changed header is worse than a missing one: the feature
      # id the probe creates must exist in the fetched tree, or the build
      # fails here rather than the probe failing on the rig. Full enum
      # constant as spelled in nvsdk_ngx_defs.h, not a bare substring.
      - name: Verify NGX pin (NVSDK_NGX_Feature_Reserved18)
        shell: bash
        run: |
          grep -rq 'NVSDK_NGX_Feature_Reserved18' ext/ngx || {
            echo "::error::Pin drift - fetched tree does not declare NVSDK_NGX_Feature_Reserved18"
            exit 1
          }

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      # Multi-config generators may append a per-config subdirectory, so
      # locate by name rather than assuming a path. The extension must
      # REPLACE .dll — a *.addon64.dll is CI-green and rig-dead.
      - name: Verify artifact name
        shell: bash
        run: |
          if find build -name 'mgpu_bridge.addon64.dll' -type f | grep -q .; then
            echo "::error::Built mgpu_bridge.addon64.dll - SUFFIX appended to .dll instead of replacing it"
            exit 1
          fi
          ADDON=$(find build -name 'mgpu_bridge.addon64' -type f | head -n1)
          if [ -z "$ADDON" ]; then
            echo "::error::mgpu_bridge.addon64 not produced"
            find build -maxdepth 3 -type f || true
            exit 1
          fi
          echo "ADDON_PATH=$ADDON" >> "$GITHUB_ENV"
          echo "Output verified: $ADDON"

      # SHIPPED PRESETS MUST BE EMPTY, and this is checked rather than trusted.
      #
      # assets/gpu1.ini once shipped enabling Lumenite_QuantMotion with
      # DEBUG_FLOW=1, because it had been copied out of a working game folder
      # and ReShade's AutoSavePreset writes whatever the last session left
      # enabled back into any preset that lives beside a game. Every fresh
      # install then drew a motion-flow debug view over the neural output. It
      # cost a night of wrong hypotheses and invalidated two measurement runs
      # before the P1.6 guard named it in the log.
      #
      # The fix is not "remember to clean the file". The fix is that a preset
      # enabling anything cannot leave CI.
      - name: Verify shipped presets are empty
        shell: bash
        run: |
          FAIL=0
          if grep -nE '^\s*Techniques\s*=\s*\S' assets/gpu1.ini; then
            echo "::error::assets/gpu1.ini enables techniques - a shipped preset must be empty"
            FAIL=1
          fi
          if grep -nE '^\s*TechniqueSorting\s*=\s*\S' assets/gpu1.ini; then
            echo "::error::assets/gpu1.ini carries a technique sort order - a shipped preset must be empty"
            FAIL=1
          fi
          if grep -n 'DEBUG' assets/gpu1.ini; then
            echo "::error::assets/gpu1.ini carries a debug preprocessor definition"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || exit 1
          echo "assets/gpu1.ini is clean."

      # Everything the drop-in package needs must exist before the deploy set
      # is staged, so a missing config file fails here by name rather than
      # producing a package that is quietly incomplete.
      # The shipped default is an UNBOUNDED run. Frames=0 is a shipping
      # decision; Frames=<n> is a measurement decision, and the two live in
      # different places from the code that interprets them - P7.6 taught the
      # add-on that 0 means unbounded while assets/mgpu.ini still said 3000, and
      # nothing in a log distinguishes a deliberate bound from a stale one.
      - name: Verify the shipped run is unbounded
        shell: bash
        run: |
          if ! grep -qE '^\s*Frames\s*=\s*0\s*$' assets/mgpu.ini; then
            echo "::error::assets/mgpu.ini does not set Frames=0 - the shipped build must be unbounded"
            grep -nE '^\s*Frames\s*=' assets/mgpu.ini || true
            exit 1
          fi

      - name: Verify the config set is present
        shell: bash
        run: |
          MISSING=0
          for F in assets/gpu1.ini assets/mgpu.ini assets/ReShade2.ini assets/README.txt LICENSE; do
            if [ ! -f "$F" ]; then
              echo "::error::missing $F"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

      # The artifact is the complete deploy set: every file here goes into
      # <game>\...\Binaries\Win64\ beside dxgi.dll, at the zip root.
      # Staged into one directory on purpose — upload-artifact roots the zip
      # at the least common ancestor of its inputs, so listing build/... and
      # assets/... directly would preserve both paths instead of flattening.
      #
      # P1.0b RENAMES THE ADD-ON HERE, and only here. nvngx_dlssnr.dll
      # resolves the module owning its caller's return address and requires
      # that module's file path to contain the literal substring
      # "nvngx.dll"; a caller that fails the test gets 0xBAD00002
      # FAIL_PlatformError. The add-on is itself the module that calls the
      # snippet, so its own name is what has to satisfy the check.
      #
      # The rename lives in this step rather than in CMakeLists.txt on
      # purpose: CMakeLists.txt stays closed, and the "Verify artifact name"
      # step above keeps checking the name CMake actually produces. The
      # build tree is unchanged; only what ships is renamed.
      #
      # Do NOT shorten this to a bare "nvngx.dll". A directory or an
      # executable with that name breaks process startup; only a calling
      # DLL's name is safe to change, and it must keep the .addon64
      # extension or ReShade will not load it.
      - name: Stage deploy set
        shell: bash
        run: |
          mkdir -p _deploy
          cp "$ADDON_PATH" _deploy/nvngx.dll_mgpu_bridge.addon64
          # The complete drop-in set. mgpu.ini in particular MUST ship beside
          # the add-on: P7.2 resolves it from the add-on's own directory rather
          # than the working directory, so a package without it silently runs
          # every setting at its default and the log says which file it read.
          cp assets/gpu1.ini      _deploy/
          cp assets/mgpu.ini      _deploy/
          cp assets/ReShade2.ini  _deploy/
          cp assets/README.txt    _deploy/
          cp LICENSE              _deploy/
          ls -l _deploy
          test -f _deploy/nvngx.dll_mgpu_bridge.addon64
          test -f _deploy/mgpu.ini
          case "$(ls _deploy)" in
            *nvngx.dll_*) ;;
            *) echo "::error::Deploy set does not carry the nvngx.dll_ caller-gate prefix"; exit 1 ;;
          esac
          # Printed into the build log so what a build ships is a matter of
          # record, rather than something to be downloaded and unzipped later
          # to find out.
          echo "--- gpu1.ini as shipped ---"
          cat _deploy/gpu1.ini
          echo "--- mgpu.ini keys as shipped ---"
          grep -vE '^\s*(;|$)' _deploy/mgpu.ini || true

      # The artifact is six files. Stated as a number so that a file added to
      # assets/ without a decision cannot reach a user's game folder unnoticed.
      - name: Verify the artifact is exactly the six-file set
        shell: bash
        run: |
          COUNT=$(ls -1 _deploy | wc -l)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::_deploy holds $COUNT files, expected 6"
            ls -1 _deploy
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mgpu_bridge
          path: _deploy/
          if-no-files-found: error
