; ReShade configuration for the BRIDGE runtime.
;
; ReShade builds a second effect runtime for the bridge's own swapchain, and
; this is that runtime's config. You did not create it and you cannot remove it
; - the runtime exists because the add-on creates a swapchain inside a process
; ReShade has hooked. Delete this file and ReShade writes a new one with its own
; defaults, which is how a debug shader ended up drawn over the neural output
; for a whole session on the development rig.
;
; The two settings that matter are PresetPath and AutoSavePreset. Everything
; else is ReShade's normal defaults.

[GENERAL]
EffectSearchPaths=.\reshade-shaders\Shaders\**
NoDebugInfo=1
NoEffectCache=0
NoReloadOnInit=0
PerformanceMode=0
; The bridge runtime gets its own preset, so nothing you enable for the GAME is
; also drawn on top of the neural output.
PresetPath=.\gpu1.ini
PresetShortcutKeys=
PresetShortcutPaths=
PresetTransitionDuration=1000
SkipLoadingDisabledEffects=0
StartupPresetPath=
TextureSearchPaths=.\reshade-shaders\Textures\**

[INPUT]
ForceShortcutModifiers=1
InputProcessing=2
KeyEffects=0,0,0,0
KeyFPS=0,0,0,0
KeyFrametime=0,0,0,0
KeyNextPreset=0,0,0,0
KeyOverlay=36,0,0,0
KeyPreviousPreset=0,0,0,0
KeyReload=0,0,0,0
KeyScreenshot=44,0,0,0

[OVERLAY]
; ZERO, DELIBERATELY. With AutoSavePreset=1 anything toggled in the overlay is
; written back to gpu1.ini when the game closes, so a preset drifts between runs
; with nobody editing a file - and the next run silently differs from the one
; you measured. Leave this at 0 while taking measurements.
AutoSavePreset=0
ClockFormat=0
FPSPosition=1
ShowClock=0
ShowForceLoadEffectsButton=1
ShowFPS=2
ShowFrameTime=0
ShowPresetName=0
ShowScreenshotMessage=1
TutorialProgress=2

[SCREENSHOT]
ClearAlpha=1
FileFormat=1
FileNaming=%AppName% %Date% %Time%_%Count%
SavePath=.\
SavePresetFile=0

[STYLE]
Alpha=1.000000
ColFPSText=1.000000,1.000000,0.784314,1.000000
FontScale=1.500000
FontSize=13.000000
FPSScale=1.000000
StyleIndex=2
