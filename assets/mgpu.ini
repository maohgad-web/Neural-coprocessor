[MGPU]
; ===========================================================================
; MGPU Bridge 0.3.1 - THE DEFAULT. One file, every title.
;
; This is the shipping configuration. It arms itself, runs until you quit,
; and writes a summary at the end so a run can be read without watching it.
;
; ---- INSTALL LAYOUT. READ THIS ONE. ----
;
; nvngx_dlssnr.dll MUST NOT sit beside the game executable. Put it in a
; subfolder next to the add-on:
;
;     <game exe folder>\mgpu\nvngx_dlssnr.dll
;
; Proven 2026-09-13: with that DLL beside the executable, the title's own
; Streamline scans the folder, loads it, and binds NGX to the GAME'S GPU
; before this add-on's thread exists. CreateFeature on the second adapter
; then faults inside NVIDIA's allocator and takes the process down. The
; title never wanted that DLL - 0.1.0's install instructions put it there.
;
; The panel says INSTALL PROBLEM if it finds a copy beside the exe. Believe
; it. Any subfolder name works, but mgpu is the documented one.
;
; mgpu_depth_tap.fx goes in ReShade's Shaders folder. The add-on switches it
; on itself, so nothing needs enabling in the effects list. Depth=1 below
; needs it: without it ReShade never binds a depth buffer and the bridge
; waits instead of arming. ReShade.log says TAP = ABSENT when it is missing.
;
; ---- WHAT IS DELIBERATELY OFF ----
;
; Reflex and Auto are deferred to 0.3.0. Both work, neither is proven on a
; second machine, and a release whose headline is "the crash is gone" does
; not need two experiments riding along.
;
; Super resolution on the second card is OFF by default so that neural
; rendering runs at full resolution. It works, it is in the panel, and
; SRUpscale=1 turns it on - see that section below.
; ===========================================================================

; ---- transport ----
Depth=1
MVec=3
MVecScaleX=1.0
MVecScaleY=1.0
MVecDX=0.0
MVecDY=0.0
DepthInverted=1
; DepthTransport (R312; 3 is the 0.4.0 default) - how depth travels. Prints a [R312] DEPTH LANE
; line at any value.
;   absent or 1: output size, 32-bit (as before).
;   2: output size, 16-bit.
;   3: render size (from the game's own DLSS table), 32-bit.
;   4: render size, 16-bit.
; 2-4 push the size/format into mgpu_depth_tap.fx (it reloads once at start).
DepthTransport=3
CopyQueue=2
; StageCopy (R333, 0.5.0 discovery; Dave's OPT5 design). 0 or no line: the game's
; own list copies colour, depth and vectors straight into the shared heap in
; system memory, inside the game's frame (as today). 1: the game's list copies
; into a VRAM staging ring on the render card (a fraction of a millisecond) and
; a copy queue on that card moves each slot to the shared heap on the DMA engine
; while the game renders the next frame. Costs RING x slot bytes of GPU 0 VRAM
; (about 240 MB at 1440p, measured; more at 4K). Turns itself off, loudly, if it
; cannot come up. Read the [R333] line. 0.5.0 default: 1.
StageCopy=1
Calib=2

; DX11 - the D3D11 path (R227). 1 (the default since 0.3.0): a D3D11 title
; streams through the D3D11 producer. 0: D3D11 titles are left alone.
DX11=1

; CalibRung - which of the calibrator's two install routes may run. Calib=
; above says what it does once DLSS is running; this says what install is
; allowed to touch. Leave at 0 unless a title is being triaged.
; 0 both (the default)   1 the import-table swap alone   2 the data scan alone
CalibRung=0
; MvecFromEval - where the motion vector copy is taken from.
; 0 off, the barrier route only.
; 1 on, copy at the DLSS pass from the first frame.
; 2 AUTO, and the shipped value since 0.2.2. Off until the barrier route
;   has produced nothing while the calibrator holds the game's own table,
;   then armed. It cannot engage on a title where the barrier route works,
;   because the copies would not be zero.
MvecFromEval=2
; MVecBarrierSource (R315; 2 is the 0.4.0 default) - the barrier route also fires on the
; buffer the game hands DLSS (the calibrator's handle), not only on a census
; candidate. When it fires, the copy at the DLSS pass never arms.
;   absent or 0: as before.   1: on.
;   2: the judge: for a short window the same frame is copied twice (at the
;      DLSS call, as today, and at the end of the frame) and compared.
;      Identical on this title -> the end-of-frame copy carries the vectors
;      (cheaper for the game); different -> the DLSS-call copy carries, as
;      today. Re-judged when the buffer changes and every 18000 frames.
MVecBarrierSource=2
; HistoryGate (R323; 1 is the 0.4.0 default) - a frame the game's own DLSS did not
; evaluate (a menu, a video, a loading screen) is denoised with no history on every
; pass, and the first frame with DLSS again starts the history fresh. So a menu at a
; very high frame rate never builds history that then trails or strobes in the game.
; A title with no NGX table cannot tell and behaves as before.
;   absent or 0: as before.   1: on.
; If you play with the game's frame generation on, set HistoryGate=0.
; With frame generation this setting does not work yet.
HistoryGate=1
; MVecSealValid (R331, 0.5.0 discovery; after davidm71's fix) - the bridge decides
; whether a frame carries depth and motion vectors from a tag written together with
; the frame's seal, instead of a flag that the next frame can clear early. With the
; copy queue it binds what the copy really carried. Expected effect: the
; "flag disagreements" counters in the [R63] and [R78] lines read 0.
;   absent or 0: as before.   1: on.
MVecSealValid=0
; LateLatch (R343, 0.5.0 discovery; Dave's design) - needs CopyQueue=1 or 2. Near the
; end of each neural evaluate the newest frame that has arrived is copied to the neural
; card, so the copy overlaps the evaluate instead of running before the next one. The
; next evaluate uses that frame if it is at most LateLatchAge game frames older than
; the newest one; otherwise the newest is used as before. More neural frames per second
; when the neural card is the slower side; up to LateLatchAge frames more latency.
;   absent or 0: as before.   1: on.   LateLatchAge 0..4, default 2.
LateLatch=0
LateLatchAge=2
; RingEdgeProbe (R344, 0.5.0 discovery) - a measurement only. Counts, for every frame
; the neural card evaluates, how many frames the game had already produced past it
; when its copy was decided, and how many of those frames then had no depth or no
; vectors. One line every 1200 frames. Nothing changes.
;   absent or 0: off.   1: on.
RingEdgeProbe=0
; Factory4 (R335, 0.5.0 discovery) - the bridge asks DXGI for an IDXGIFactory4
; instead of an IDXGIFactory2 when it builds its own swap chain. For games that ship
; 3DMigoto (d3d11.dll + d3dx.ini beside the game), which refuses IDXGIFactory2 and
; stops the bridge before it starts. Nothing else changes.
;   absent or 0: as before.   1: on (0.5.0 default; IDXGIFactory4 exists wherever
;   D3D12 does, so nothing is lost on games without 3DMigoto).
Factory4=1
; MVecHoldD3D12 (R336, 0.5.0 discovery) - on a DirectX 12 game that runs DLSS but
; does not create it until a menu toggle, the bridge waits for the game's motion
; vectors with no limit and shows ARMING. With this key it waits that many frames,
; then starts on the synthetic zero field with depth (the same as MVecStepAside=1).
;   absent or 0: no limit, as before.   600: about ten seconds at 60 fps.
MVecHoldD3D12=0
; MVecLateProbe (R336) - after that start, if the game creates DLSS later, write one
; line with what it declares (buffers, sizes). Nothing changes in the session.
;   absent or 0: off.   1: on.
MVecLateProbe=0
; MVecLatchOffset (R338, 0.5.0 discovery). 0 or no line: frame f's colour is
; evaluated with frame f's vectors (as today). k = 1..4: with the vectors of
; frame f-k instead, when the ring still holds them (otherwise f's, counted).
; One of the flicker levers; the stepper below walks 0/1/2.
MVecLatchOffset=0
; StrobeCalib=1 (R338): the flicker calibrator. For one launch it walks 12
; settings - MVecLatchOffset 0/1/2 x PassReset (as set / 2) x NRFrameFilter
; (as set / flipped) - holding each StrobeHold seconds (default 8), scores
; each on a 64x64 strip of the output against the input (the output change on
; frames where the input did not change is the strobe number), prints a
; ranking and restores the launch values. Levers it cannot move live are
; arm-time; the 0.3.0 binding is one relaunch with DepthTransport=1
; MVecBarrierSource=0 HistoryGate=0. No line: nothing runs.
StrobeCalib=0
;StrobeHold=8
JitterComp=0

; RingWindow=1 settled by measurement: zero DROPPED, zero REORDERED, zero
; STALE across 16,958 frames, against 3011 fault lines with it off.
RingWindow=1
Stride=0

; ---- neural stage ----
Neural=1
; Passes 1 or 2. 3 and 4 exist as Experimental (R350): the add-on builds that
; many pass features at start and holds the second GPU at its power limit.
; Each extra pass is set with Pass3 / Pass4 and NRPreset3 / NRPreset4 below.
Passes=1
Intensity=2.00
PassReset=0
Tuning=0
ToneStrength=1.0
StructureStrength=1.0
SkinStrength=1.0
Style=0.0
AutoMask=1
Subrect=100
CostCurve=0

; ---- super resolution ----
;
; SRUpscale=0 IS THE DEFAULT, AND IT IS A QUALITY DECISION.
;
; Off, neural rendering runs at the full display resolution. On, it runs at
; SRScale percent and DLSS enlarges the result, which is cheaper and is what
; lets a weaker second card keep up with a stronger render card - but it is
; a reconstruction, and the full-resolution pass is the better picture.
;
; The add-on's panel in the ReShade overlay (Home) turns it on, and its
; quality / balanced / performance modes then choose the resolution. Turning
; it on there writes SRScale and SRMvLowRes together, which is the only safe
; way to set them - see the note below.
;
; SRSnippet=1 loads the DRIVER's nvngx_dlss.dll rather than the game's. That
; is a different module instance from the one the title already initialised,
; which is why SR has been working while neural rendering crashed. If no
; driver copy is found the add-on looks for its own in the mgpu folder, and
; only then falls back to the game's - with a warning, because that is the
; arrangement that faults.
SRUpscale=0
SRSnippet=1
SRPreset=0
SRQuality=2

; R - the resolution neural rendering actually runs at, as a percent of the
; display per axis. This is what the panel's modes write, using DLSS's own
; ladder: quality 67, balanced 58, performance 50. IT ONLY DOES ANYTHING WITH
; SRUpscale=1 above AND Experimental Upscaling selected in the panel.
;
; 0.2.1: SRScale=0 IS THE DEFAULT AND IT IS NATIVE UPSCALING. R is inherited
; from the game's own render extent, so its motion vectors are used exactly as
; reported, at scale 1.0.
;
; 0.2.4: SRMvLowRes IS NOW 2 - DERIVE - AND WAS 0 BEFORE. With 0 the add-on
; told DLSS the vectors spanned the display when they spanned the game's
; render extent, and it read every vector about 1.5x too long. That smears.
; Measured on Cyberpunk 2077 with the game at DLSS Quality; 2 fixes it and
; is correct at DLAA too. An earlier note here claimed this pair had never
; ghosted - that claim was wrong and it is why this took so long to find. It does nothing on a title that is not upscaling - the log
; says so and SR switches itself off for that run.
;
; Experimental Upscaling in the panel writes the other pair - SRScale 67/58/50
; with SRMvLowRes=1 - which is cheaper and works on every title, at the cost of
; rescaling the vectors. They are one setting and the panel always writes both.
;
; SRScale=0 would mean "inherit R from the game's render extent", which does
; nothing at all on a title rendering at native - four of the five titles
; measured 2026-09-13 were in exactly that state, so the whole DLSS section
; of the panel did nothing on them. Choosing R ourselves is what makes the
; modes mean the same thing on every title whatever the game's DLSS is set to.
;
; SRMvLowRes RIDES WITH THE SCALE. The flag without the scale is the
; combination that returned FAIL_PlatformError. They are one setting.
SRScale=0
SRMvLowRes=2
; SRVectors (R217; 0.5.0 text, A5) - what DLSS upscaling on the neural card is
; told about motion when it runs more than one game frame after its previous
; evaluate (the neural card is slower than the game). No line: the vectors as
; the game reported them, for one frame. multiply: the vectors scaled by the
; number of game frames since the previous evaluate, as neural rendering already
; does (R87). Dave (davidm71) uses multiply and reports less flicker while moving
; with Native upscaling (SRScale=0). Left as a lever here: set it if you see
; flicker in motion with SRUpscale=1. chain: follows each skipped frame's own
; vectors instead (R217; counted when it cannot).
;SRVectors=multiply

; ---- latency ----
; 0.3.0. The driver mode is per-device and outlives the process, so a crash
; leaves it set. The add-on writes ReflexApplied and clears the residue on the
; next launch, but the toggle stays out of 0.2.0's panel.
Reflex=0
ReflexSleep=0
ReflexLatency=0

; ---- automatic quality. 0.3.0, never run. ----
Auto=0
AutoTargetFps=60

; ---- the run ----
AutoArm=1

; ---------------------------------------------------------------------------
; DcompOverlay = 1 (default) | 0 | auto     V49-V55, V65-V71, R266.
; ---------------------------------------------------------------------------
;
; FOR ONE MONITOR WITH THE RENDER CARD HEADLESS, AND NOTHING ELSE.
;
; auto  ON only for one active display path AND a bridge adapter driving no
;       display of its own - the configuration this was built for and the only
;       one it has been tested in. Every other answer, including any the
;       display APIs could not be read for, is OFF. The [V66] line names both
;       numbers and the verdict.
;
; 0  The bridge opens its own window, as every build before 0.3.0 did. If
;    you are using Special K or a second monitor today, this is your
;    setting and nothing below applies to you.
;
; 1  The bridge creates NO VISIBLE WINDOW. Its present chain becomes a
;    DirectComposition swapchain - which takes no HWND and so cannot be in
;    anyone's Z-order - and that becomes the topmost composition visual on the
;    GAME's own window.
;
;    WHY: a second window on the desktop is something a game engine can see.
;    It sees it, decides it is no longer the thing on top, and locks its own
;    input. That lock, not input ROUTING, is what makes a controller work in
;    one title and not another. With no second window there is nothing to
;    detect and nothing to lock on, and the game keeps keyboard, mouse and pad
;    with no external tool in the path.
;
;    WHAT IT COSTS. The visual covers the game's whole window, so the game's
;    own ReShade overlay is drawn UNDERNEATH it. The overlay is not broken -
;    it is drawn correctly and invisibly, which is the same fact that proves
;    the composition is working.
;
;      CTRL+ALT+F6   hides the bridge visual and brings it back.
;
;    That is how you reach the overlay, and how you dismiss the run-end screen
;    when a bounded stream finishes. It unroots a visual and roots it again:
;    the swapchain keeps presenting throughout and the stream is never touched,
;    so it is safe to press mid-run. Registered ONLY when this is 1.
;
;    Before the stream arms, the bridge has no neural frame to show, so the
;    visual is deliberately NOT on screen yet and you see the game. It is
;    rooted on the first frame that actually carries neural output.
;
;    IF IT FAILS IT SAYS SO, and it falls back to the bridge's own window. The
;    lines to read are [V49], [V51] and [V53]. At most two composition targets
;    exist per window, one topmost and one not; if something else already holds
;    the topmost slot, [V49] names the HRESULT.
;    RESOLUTION CHANGES. The warning further up this file - do not change
;    resolution, DLSS mode or graphics presets while the stream is ARMED -
;    applies here exactly as it does in every other mode. It is not a
;    limitation of this one: source size, row pitch, bands and the shared heap
;    are all fixed at arm whatever the presentation path. What IS different is
;    that the fault is harder to SEE: there is no bridge window to watch go
;    wrong, so a stale arm shows up as a subtly incorrect picture composited
;    over a correct game. Disarm, change it, arm again.
;
; 1 is honoured ONLY on a single active display path - see [V55]. On anything
; else it is refused and the bridge opens its own window. A missing key
; means 1 (R266).
DcompOverlay=1
; ---- DcompMultiDisplay: more than one display (R273) ----
; With more than one active display, the composition mode is decided by
; detection: the add-on reads which card the display under the game's window
; is connected to. On the neural card: composition is used. On the card that
; renders the game: refused, the bridge opens its own window. Duplicate
; displays, an unknown card, or a card that is neither: refused.
; One display: this key is not read.
; absent (default): by detection, as above.
; 1: accept always, no detection.
; 0: refuse always (the gate before 0.3.0).
; If every display is on the card that renders the game and the neural
; card drives none, a refusal does not avoid the bus: the bridge window is
; on the game's card too. 1 keeps the composition mode in that case.
; The [R273] line in the log says what was detected and why it decided.
;DcompMultiDisplay=

Frames=0

; ---- window ----
Present=nr
; PresentVsync=1 waits for vblank on the bridge window's own present.
; 0 presents immediately - expect tearing. It exists because nothing in
; this project measures past the evaluate, and 0 is the only lever that
; reaches the output stage. 0 is not a quality setting.
PresentVsync=1
; PresentBuffers 2-6 (restart; R348, ZhizhenS): how many buffers the bridge
; window rotates through. If frame generation shows horizontal bands over the
; picture or the panel, try 6. Each buffer costs about 33 MB at 4K. 2 is the old
; behaviour. Measured on a fork with an immediate present; with PresentVsync=1
; more buffers may let more frames queue - not measured yet.
PresentBuffers=2
; ChainColorSpace (R345, Knowmind) - tells Windows how to read the bridge's
; picture. HDR games: without it the HDR frame is read as sRGB and looks milky
; grey or blown out. It changes how the frame is shown, not the neural pass.
;   auto: follow the game (0.5.0 default). The add-on reads the game's own
;         colour space and sets the same one: sRGB game = nothing set; scRGB
;         game = 1; HDR10 game = 12.
;   no line: never set (as before).   0: sRGB.   12: HDR10 (ST.2084 / Rec.2020).
; Check in ReShade.log: [MGPU][H1] ... SetColorSpace1 hr=0x00000000.
ChainColorSpace=auto
; NRPreset / NRPreset1..4 (R349, N01950) - which DLSS-NR network each pass
; builds, given when the feature is created. Changing it needs a relaunch.
;   0: the DLL's default (the small network on nvngx_dlssnr.dll 310.9.16 or
;      newer; the big network on older DLLs).
;   1: the big network (CC_Control). Removes the strobing the small network
;      shows with StructureStrength above 1.40; costs more.
;   2: the small network, named explicitly.
; nvngx_dlssnr.dll before 310.9.16 carries the big network only and runs it
; for any value here; ReShade.log says so at start ([R351]).
;   no line: the hint is never given.
;   0.5.0 default (R360, Dragon Sword: the small network on the NRS pass 1 strobed
;   when moving; the big one did not, still 1:1 at x1): the big network on pass 1
;   at x1 and on the 2nd pass at x2.
; NRPreset1x2 (R361): pass 1's network while TWO OR MORE passes run. No line: pass 1
; keeps NRPreset1 at any pass count. Switching x1 <-> x2 in the panel rebuilds
; pass 1 once (a short hitch) when the two values differ. Default 0: the small
; network on pass 1 at x2, the big one on the 2nd pass (more fps; the 2nd pass
; covers the strobe).
NRPreset1=1
NRPreset1x2=0
NRPreset2=1
; PresentRaceProbe=1 is a diagnostic: every frame's back buffer is cleared to
; magenta first, so a screen reading a buffer mid-write shows a magenta band.
PresentRaceProbe=0
Window=FIT
Monitor=auto
; NoActivate=2 auto-detects duplicate/clone display mode and stops the bridge
; window stealing input. 0 off, 1 force, 2 auto.
NoActivate=2

; ---------------------------------------------------------------------------
; SFPath = absent (default) | 0 | 1          0.2.5. TITLE REPAIR.
; ---------------------------------------------------------------------------
;
; Some engines destroy and recreate their DLSS feature repeatedly. The add-on
; keeps a fixed list of feature slots, and once that list is full it stops
; copying from the feature the game is actually using. Found on Starfield.
;
; ABSENT IS NOT OFF. With no line here the DETECTOR runs and the repair does
; not - and if the add-on sees the overflow actually happen, IT WRITES
; SFPath=1 INTO THIS FILE ITSELF. That is deliberate: the repair is useless
; if only the titles already known about ever get it. The key is read at arm,
; so the session that detects it is unchanged and the next one is repaired.
;
; An explicit 0 is your answer and is never overruled. Set 0 if you would
; rather the add-on left this file alone.
;
; Verified on Starfield and run once on RoboCop Rogue City, where it changed
; nothing. Any other engine is unknown.
;SFPath=1

; SwapGuard = 0 (default) | 1 | 2           0.2.5. DIAGNOSTIC, off.
; Does nothing unless set. It is here so it is findable, not so it is used.
SwapGuard=0

; ---- probes. All off: they answer questions this run is not asking. ----
MetaProbe=off
MetaProbeLogSeconds=3
; MVecTap. OFF (absent or 0) by default. 1: the add-on copies the velocity
; buffer it found at arm once per frame when the engine never hands it over
; (D3D11: R254; D3D12: R277, before-state assumed shader_resource).
; 2: D3D12 only, before-state assumed common. A debug instrument: read the
; [R257] vector probe line for what arrived.
;MVecTap=0
; MVecCandidate. Which of the velocity buffers the census found the tap
; copies (0 = the largest, as before). MVecLearned. Written by the add-on:
; with the tap on, the first launches test the candidate against the
; picture (R258 warp test). A candidate that lines up is kept
; (MVecLearned=its index); one that makes it worse moves to the next on the
; next launch; none left turns the tap off (MVecLearned=99, depth only).
; Once written, the test does not run again. Delete it to test again.
;MVecCandidate=0
;MVecLearned=
; ---- If the picture strobes on a title without DLSS (no NGX contract) ----
; The add-on has no motion vectors from the game on such a title and looks
; for them itself: R280 on D3D12 (a four-channel target), then the velocity
; tap (a two-channel target the census found). The first launch tests what
; it found against the picture and writes the result here (MVecLearned).
; Strobing means the vectors it bound are not the camera's motion.
; D3D12: set MVecSweep=1 and play with camera motion. Every buffer is fed
;   in turn, MVecSweepSeconds each, and ReShade.log scores each one
;   ([R307] SWEEP result: lower best/none is better). CTRL+ALT+PAGEDOWN
;   next, PAGEUP previous, END marks the one on screen: that mark writes
;   MVecPin=<its setting> and MVecSweep=0 here, and the next launch feeds
;   that setting alone (R311). Nothing is written unless you press END.
; Before a sweep: start from a fresh copy of this file (no MVecSource,
;   MVecLearned or MVecPin line), keep MVecStepAside at 0 or auto, and turn
;   off the game's dynamic resolution. A buffer that changes size cannot be
;   fed correctly. Keep it off on every launch after the mark too.
; D3D11: set MVecTap=1 and MVecCandidate=N (N from the [R278] list), delete
;   the MVecLearned line, relaunch. One candidate per launch.
; A candidate that lines up is written back and kept. When none does, the
; add-on writes MVecLearned=99: that binds the zero field (no motion given
; to the model). This is the right state for a title
; whose buffers carry no camera motion (Far Cry 6). MVecSource=3 forces it
; without testing. MVec=0 gives colour and depth only.
; Nothing of this runs on a title with a DLSS contract unless MVecSource
; says so.
; MVecSweep=1 (R307/R308, D3D12, a test mode you turn on): see the note.
;MVecSweep=0
;MVecSweepSeconds=15
; MVecUnits / MVecSignX / MVecSignY. Written by the add-on with the verdict:
; the UNIT of the game's vectors (uv, uvhalf or px) and their signs. The
; scale itself is derived at every launch from that launch's sizes, so the
; same ini is right on any display or render scale. MVecScaleX/Y other
; than 1.0 overrides this (your own number).
;MVecUnits=
;MVecSignX=1
;MVecSignY=1
; MVecExtract / MVecExtractOff (R280, D3D12 titles with no DLSS contract).
; Some engines (RE Engine: Resident Evil 4) keep their motion vectors in the
; first two channels of a four-channel G-buffer target. The add-on finds that
; target by how the engine uses it (a few seconds of gameplay), copies it
; mid-frame on GPU 0 and extracts x,y into a two-channel target of its own,
; which the velocity census then sees as it would Skyrim's. Nothing of this
; runs on a title with a DLSS contract or on D3D11. MVecExtract is written by
; the add-on at exit (the source's DXGI format number) so the next launch
; decides in a second; MVecExtractOff=1 turns the whole thing off.
;MVecExtract=
;MVecExtractOff=0
MVecProbe=0
MVecProbeIndex=0
DepthCompare=0
Probes=0
Profile=0

; ---- process census. Off. Turn it on only when asked for a report. ----
;
; A troubleshooting tool for NGX and NVAPI configuration issues. Once per
; launch, when the neural feature starts, it writes to ReShade.log which files
; are loaded in the game. It never writes full paths: no folder names and no
; user name.
;
; With ProcessCensus=1, for each file loaded in the game:
;   - One line with the file name, its version, and where it is: mgpu folder,
;     game folder, Windows or other.
;   - For NVIDIA NGX files (names starting with nvngx or _nvngx), also the
;     file size and SHA-256. Two builds of one file can carry the same
;     version; this tells them apart.
; To do this it:
;   - Loads version.dll and bcrypt.dll (Windows files) into the game.
;   - Reads the NGX files from disk once. nvngx_dlssnr.dll is about 160 MB, so
;     the neural feature can take a moment longer to start.
;   - Changes nothing and patches nothing.
; The file names still show which programs are loaded in the game, overlays
; and capture tools included. I recommend checking the log before you post it
; in public.
; 0 or absent: none of the above.
ProcessCensus=0

; ---- LaunchRecord: the launcher's record while the game runs (R270b) ----
; 1: mgpu\last_launch.ini is refreshed every 300 bridge frames with the frame
;    rate of each card (GameFps, NeuralFps), so the launcher can show which card
;    is the bottleneck. Written on the bridge thread with the lock released.
;    If one write takes more than 2 ms the add-on sets this back to 0 and writes
;    LaunchRecordOff=<reason>; the next launch runs without it.
; 0 or absent: the record is written at arm and at the end of a bounded run only.
LaunchRecord=0

; ---- DcompFit: scale the composed picture to the game window (R271) ----
; Only with DcompOverlay=1. The neural picture is shown 1:1 at the game's
;    render size. If the game renders larger than its own window, the
;    picture does not fit.
; auto (default, also when the key is absent): a guard. The add-on scales
;    the picture to the game window only when it sees the render size larger
;    than the window; otherwise nothing is applied. The log says which.
; 1: always scale. The launcher's Force fit writes this.
; 0: never scale.
; The neural stage always runs at the game's render size.
DcompFit=auto

; ---- DrainGpu0: the GPU 0 drain at teardown (R275) ----
; 1 or absent: before the shared transfer buffer is freed, the add-on waits
;    (at most 2 s) for the game's queue to pass the last frame it signalled.
;    A normal exit waits about 0 ms; the log says how long.
; 0: no wait, as every build before R275. The add-on writes 0 here by itself
;    if the wait ever hits 2 s, with the reason in DrainGpu0Off.
;DrainGpu0=

; ---- NgxProbeAfterScene: when the add-on starts its DLSS 5 (R287) ----
; absent or 1: after the game's own DLSS is running. On a game without DLSS
; the add-on starts it when the bridge arms.
; 0: at the game's first frame, as in 0.3.0.
;NgxProbeAfterScene=1

; ---- DepthHoldMax: how long the bridge waits for the game's depth (R290) ----
; Seconds. The bridge starts once ReShade has bound the game's depth.
; If no depth arrives in this time, while the game's DLSS is running and the
; depth tap is on, the bridge starts without depth for that session.
; Otherwise it keeps waiting, and ReShade.log says why.
; 0: wait without a limit, as before 0.3.1. Absent: 180.
;DepthHoldMax=180

; ---- NRFrameFilter: the frame-generation vector fix (R222 / R223) ----
; 0: off. Set here since 0.3.1: with the game's frame generation on, 1 to 3
;    crashed Dawnwalker at the bridge start on some launches.
; 1: map only. 2: fix the vectors. 3: fix and thin.
; Absent: 3. The panel's Experimental settings write this key.
NRFrameFilter=0

; ---- NRScale: residual neural rendering at a reduced scale (N01950, R299) ----
; Off unless the NRScale line is present. No line: the add-on runs as before.
; On: DLSS-NR runs at NRScale x the native size, and its difference is added
; back onto the native picture, so the picture stays native size. Cheaper on
; the neural card. Range 0.30 to NRScaleCap. NRScale=1 is on, at 1:1.
; The scale can be changed live in the panel. Uses the DLSS-NR Cost-Scaler
; shaders (MIT, see THIRD_PARTY.md).
; The panel's Experimental settings have a switch for it: "Pass 1 scale (NRS)".
; On writes NRScale=0.75 and NRScaleResolveDepth=0. Off writes NRScale=0.
; While it is on, the 2nd pass (ResidualPass) stays off and x2 runs the full
; 2nd pass. Restart the game after changing it.
;NRScale=0.75
;NRScaleCap=1.00
; NRScaleResolveDepth=0 (Dom / lordzaxxon555-art): the residual composite runs
; without its depth (silhouette) guard; DLSS-NR still gets depth. Fixes stripes
; and a dark veil on shadowed faces seen on Starfield with NRScale and Depth=1.
; Absent or 1: unchanged.
;NRScaleResolveDepth=0
; NRSPass=2 (R354, N01950, Experimental): with NRScale set, every pass runs the
; NRScale path at the same scale, each on the pass before it. Absent or 1: pass 1
; only. With Passes=3 / 4 this is the 3 / 4 NRScale stack. ReShade.log: [R354].
;NRSPass=1
; NRProbe=1 measures the neural effect in the log. Off unless set to 1.
;NRProbe=0

; ---- R341 (0.5.0 discovery, Experimental): DLSS Frame Generation on the neural card ----
; FrameGen=4: the neural card also makes the in-between frame of each pair of
; its outputs (NVIDIA's nvngx_dlssg, from the driver's model store or from the
; mgpu folder) and the bridge shows two frames per neural frame: the generated
; one first, the real one half an interval later. The game is not touched.
; Costs about half a neural interval of latency on the bridge's picture and six
; frame-sized buffers on the neural card. Needs the game's vectors and depth
; (MVec=3, Depth=1). Turns itself off, loudly, when it cannot start or fails
; three evaluates. Design by davidm71. No line or any other value: nothing runs.
FrameGen=0
; The camera the generator is told about (a ReShade add-on has no matrices):
; horizontal field of view in degrees, near and far planes. FGInvertMV=1 flips
; the vector sign if the in-between frames move the wrong way. FGPace=0 shows
; both frames back to back (A/B against the paced default).
;FGFov=90
;FGNear=0.1
;FGFar=10000
;FGInvertMV=0
;FGPace=1

; ---- R316: the residual pass (the 2nd pass at x2), on pass 1 or pass 2 ----
; A separate residual implementation with its own keys. It does not use or
; change the NRScale path above; if NRScale is set, this stays off.
; ResidualPass=1 or 2: which pass runs DLSS-NR at the work extent and adds its
; difference back onto that pass's input at native size. Any other value or
; no line: nothing is built. With ResidualPass=2 it acts only at x2 (Passes=2).
ResidualPass=2
; ResidualScale: work extent as a fraction of native, 0.30-1.00 (default 0.75).
ResidualScale=0.75
; ResidualRender=1 (R318): work extent = the game's render size from the NGX
; table (depth and vectors are already that size). Falls back to ResidualScale
; when the table has no render size at arm, or on DLAA (R316b).
; Light takes its size from the game's DLSS mode at game start.
; If you change the DLSS mode in game, restart to update it.
;ResidualRender=1
; R319: the panel's Experimental settings set these keys ("2nd pass (x2)"):
; Medium (default) = ResidualPass=2 + ResidualScale=0.75,
; Light = the same with ResidualRender=1, Full = ResidualPass=0.
; ResidualDepth=1: the resolve's silhouette guard reads depth at any size.
; Absent: the resolve gets no depth.
;ResidualDepth=1
; ResidualGain 0-2 (1.0), ResidualSharpness 0-1 (0.0), ResidualColor 0-1 (0.90),
; ResidualMode 1 (residual over the anchor) or 0 (the model output upsampled).
;ResidualSharpness=0

; ---- R332 (0.5.0 discovery): our residual on the FIRST pass ----
; NRS=0 or no line: the add-on works exactly as above (x1 = one full NR pass;
; x2 = the 2nd pass as ResidualPass says). NRS=1: pass 1 runs OUR residual
; (R316, the keys above) at the work extent, so x1 costs what the 2nd pass
; costs today. N01950's NRScale (Experimental) is a different path and still
; wins when set. Both the arm line and [RSD][R332] say which passes carry.
; 0.5.0 default: 1 (our residual on pass 1; the 2nd pass as ResidualPass says).
NRS=1
; Pass2 (with NRS=1 only): what the 2nd pass is at x2. full = a full NR pass.
; nrs = our residual again, anchored on pass 1's resolved output. No line:
; nrs when ResidualPass=2 (the panel's Medium / Light), full otherwise.
;Pass2=full
; Pass3 / Pass4 (R350, Experimental, with Passes=3 / 4): full or nrs for that
; pass, as Pass2. No line: full. Read for any pass-1 setting (R366).
;Pass3=full
;Pass4=full
; Pass2Reset=1 (E12): after a live x1 -> x2 switch in the panel, pass 2's first
; evaluate runs with Reset=1 (its feature holds history from before the switch;
; the ghost on the switch). No line: as today. Flip to 1 once run N6 holds.
Pass2Reset=0
; WeakGpuWarn (E16, default 1): one line when, at x1 with a full first pass,
; the neural card evaluates under 45 frames/s and under half the game's rate
; for 30 s - the case NRS=1 is for. 0 silences it. A log line only.
WeakGpuWarn=1

; ===========================================================================
; R300 - T1.19 CONTRIBUTED KEYS (Dom / LordZaxxon). See docs/R300_T119.md.
; ===========================================================================
; Every key below is ABSENT here, and absent (or 0) is OFF: the add-on then runs
; exactly the 0.3.1 path. Remove the ';' to turn one on. ReShade.log says which
; are on in one [R300] line at start; with none set there is no such line.
;
; ---- SceneHandleSet=1 (R300b): DLSS evaluate filter takes every latched scene
; feature, not only the newest one created. Starfield creates and releases
; several. [R300b] in the calibrator line: evals / taken / copies per handle.
;SceneHandleSet=1
;
; ---- FeatureDiag=1 (R300f1, R300f2): says when the game stops evaluating its scene
; feature, and logs each DLSS CreateFeature / ReleaseFeature (400 events max).
;FeatureDiag=1
;
; ---- Temporal record (R300a1-R300a8). TemporalDiag=1 logs; the others change NR:
; TemporalMV=single     vectors at one game frame instead of x frames elapsed
; TemporalResetK=N      reset NR history when N or more game frames passed (3..5)
; TemporalRequireTuple=1  do not bind a vector that belongs to another frame
; JitterSlot=1          slot jitter delta instead of R104's (needs JitterComp=1)
; JitterFallback=sync|zero   what R104 does after slot evaluates (JitterSlot=1)
; JitterSlotStamp / JitterDiag   default to TemporalDiag's value
;TemporalDiag=1
;TemporalDiagLines=300
;TemporalMV=multiply
;TemporalResetK=0
;TemporalRequireTuple=0
;JitterSlot=0
;JitterFallback=author
;
; ---- Perf11=1 (R300e1-R300e6): GPU 1 job timing, measurement only.
; PerfPrefetch=1 (needs Perf11=1) CHANGES SCHEDULING: evaluates the frame the
; copy queue already armed instead of the newest (PerfPrefetchMax 0..4).
;Perf11=1
;PerfLines=200
;PerfPrefetch=0
;PerfPrefetchMax=2
;
; ---- ProducerDiag=1 (R300g1-R300g6): CPU cost of the producer's copies, bytes
; sealed vs evaluated, producer backlog every ProducerReport sealed frames.
; Gpu0Timers=1 (R300h) also writes GPU timestamps into the GAME's command lists.
;ProducerDiag=1
;ProducerReport=600
;Gpu0Timers=1
;
; ---- NGX start-up (R340 text; the keys exist since 0.3.x) - for a DLSS-NR
; that refuses to start (0xBAD00001 / 0xBAD00002 at the probe or the arm).
; NGXLog=1            NGX's own log lines at VERBOSE into ReShade.log (and its
;                     own files). Off: level OFF and the other sinks disabled.
; TraceNvapi=1        (R245) what the NGX core asks of nvapi64 before and
;                     during Init: the QueryInterface ids, the DRS calls
;                     with their arguments. The same trace runs outside a
;                     game with tools\nrcheck --trace.
; NgxInitProbeGpu0=1  (R249) also runs our Init on a device on the GAME's
;                     card and logs the answer, keeps nothing. Tells a
;                     per-adapter refusal from a per-process one.
; NgxAppId=N          (R256) the application id our Init carries, decimal;
;                     default 1296127061 (0x4D475055). 0 = the old call.
;NGXLog=1
;TraceNvapi=1
;NgxInitProbeGpu0=1
;NgxAppId=1296127061
;
; ---- Streamline tags (need SLTags=1 or 2) ----
; SLTagsMvec=1 (R300c): the motion vectors the game declared to Streamline
;   replace the ranked / calibrator source. Copy timing unchanged.
; SLTagsCapture=1 (R300d): also copy them at the tag call, eOnlyValidNow tags
;   only. 2: every lifecycle (T1.19's behaviour).
;SLTagsMvec=1
;SLTagsCapture=1
;
; ---- Display ----
; BetterConsoleGuard=1 (R300j): with BetterConsole.dll loaded, composition is
;   forced on instead of the bridge window (BetterConsole aborts the game in
;   CreateSwapChainForHwnd). DcompOverlay=0 written explicitly is respected.
; DcompNoFallback=1 (R300k): when composition fails, no bridge window at all.
;BetterConsoleGuard=1
;DcompNoFallback=1
;
; ---- Panel ----
; PanelOverPicture=1  (N01950, R292-R294) with the composition overlay on, the
;                     ReShade panel is drawn over the neural picture instead of
;                     the picture stepping aside while the panel is open. Read
;                     once at load. Off: the panel behaves as 0.3.1.
; PanelAutoHeight=1   the two boxes use the overlay's height (560 px floor)
; PanelStats=1        game present cadence, derived interval / bus / MV age
; PanelPersist=1      panel and hotkey changes are written back to this file
; PanelFreeCursor=1   (R295) while the panel is live, the game stops seeing the
;                     mouse: the bridge chains the game window's procedure and
;                     swallows WM_INPUT and the legacy mouse messages, takes the
;                     raw-input devices away, clears the clip and shows the
;                     cursor. The panel polls the OS itself. Released, and the
;                     devices put back, when the panel closes or stops drawing.
;                     Absent or 0: none of it runs and the path is 0.5.1's.
;                     Re-read every time the panel opens, so one session can A/B it.
; FrameCap=N          a cap on the GAME's present, 30..240 from the panel; the
;                     line has to exist for the panel section to show; 0 = off
;PanelOverPicture=1
;PanelAutoHeight=1
;PanelStats=1
;PanelPersist=1
;PanelFreeCursor=0
;FrameCap=0


; ---- Motion-vector judge and probe cost (R309 / R310, 0.4.0) ----
; MVecStepAside: titles WITHOUT an NGX contract only (the add-on's own
; vectors: the velocity tap or the R280 extract). Titles with a contract
;   keep the game's vectors and are not touched by this key.
; auto: during gameplay the vectors as bound are judged against no motion.
;   If they make the picture worse, the zero field is bound instead, live;
;   if they line up better again, the vectors come back.
; 1: the zero field from the start - no tap, no R280, no probes (the same
;   as MVecSource=3 below).
; Absent or 0: off (the default). Set auto on a game without NGX whose
;   motion looks wrong.
MVecStepAside=0
; ProbeCost=1 writes [R310] COST lines: probe time with the shared lock held
; and released, and the game render thread's wait for it. Measures only.
ProbeCost=0
; ProbeOffLock=2: the probes' pixel loops run on a thread of the add-on's
; own, so a probe holds neither a game frame nor the bridge (R311c).
; 1: the loops run on the bridge with the shared lock released; a fast
; title can drop a frame at each probe. 0: the loops hold the lock as before.
ProbeOffLock=2
; ---- MVecSource (R311): which vectors the add-on binds ----
; Absent or 0: as above - a title with an NGX contract keeps the game's
;   vectors; a title without one takes what the add-on finds (R280, then
;   the velocity tap; the judge above decides if they are kept).
; 1: R280's extract, also on a title with an NGX contract (the game's own
;   vectors are then not used). 2: the velocity tap, the same way.
; 3: the zero field from the start, any title.
; With 1, 2 or 3 nothing is learned or written back to this file. The keys
; exist to run the no-NGX path on a title whose vectors are known good, and
; to tell a title on a non-NVIDIA game card which rung to take.
;MVecSource=0
; MVecPin (R311): written by the add-on when CTRL+ALT+END marks a setting in
; a sweep (MVecSweep=1, below). The next launch feeds that setting alone.
; Delete the line for the path as before. Seven numbers, do not type by hand.
;MVecPin=
; TransitProbes=1 (R302) runs the two start-up transit probes that place test
; objects on the GPUs before the arm. Off: nothing is placed at start-up.
; Absent or 0: off.
;TransitProbes=0
; ---- StartupTrace (R313): what the add-on does at start-up, in order ----
; StartupTrace=1 writes [TRACE] lines with their own time and thread at each
; start-up step, samples the game's present rate, and writes a record when
; the game's presents stop after the first neural frame or a device is lost.
; The record is also in mgpu\startup_trace.last and the next launch reports
; a session that did not end cleanly. 2 = also fires the record once by
; itself 5 s after the first neural frame (a self-test). Absent or 0: off.
;StartupTrace=0
; StartupTraceStallMs: how long the game's presents must be flat before the
; record is written. Absent: 3000.
;StartupTraceStallMs=3000
; ---- DcompSafeMode (R313): the composition mode with less on the game ----
; Absent or 0: the composition mode (DcompOverlay=1) exactly as before.
; 1: the composition decision and the overlay's root toggle run on the
;    bridge thread only.
; 3: as 1, and every compositor commit is waited for, the resize at arm is
;    done off screen, and the picture goes on screen only after the game's
;    swap chain has been quiet for DcompSafeQuietMs. If the game's presents
;    still stop after the first neural frame, the add-on writes
;    DcompOverlay=0 here (the bridge's own window) for the next launch and
;    says so.
; Any other value is off.
;DcompSafeMode=0
;DcompSafeQuietMs=1000
;DcompSafeFallbackMs=10000

; ---- crash-recovery bookkeeping. The add-on owns these. Leave at 0. ----
ArmCrashed=0
ReflexApplied=0
