[MGPU]
Frames=3000
Neural=1
Profile=0
Probes=0
Present=nr
Passes=1
Intensity=1.00
Window=fit
;Preset=back

; Per-pass intensity overrides. Absent means "use Intensity".
; IGNORED ENTIRELY when Preset= is set - the preset writes every pass.
; Intensity1=0.84
; Intensity2=0.40
; Intensity3=0.25
; Intensity4=0.15
; Intensity5=0.10
; Intensity6=0.10

; Set.<key>=<value> is handed to NGX verbatim before every evaluate. A value
; with a '.' is sent as a float, otherwise unsigned. Up to 12. A key on the arm
; line was SENT, not necessarily HONOURED.
; Set.DLSSNR.DiffuseWhite=100.0

; ---------------------------------------------------------------------------
; KEYS GO ABOVE THIS LINE. Everything below is commentary.
;
; THIS FILE IS READ FROM BESIDE THE .addon64, not from the working directory
; (P7.2). Each game folder therefore needs its own copy, and the P7.2 line in
; the log names the exact file that took effect. If that line is missing or
; names somewhere unexpected, every value below is at its default no matter
; what this file says.
;
; Present  nr    = the DLSS-NR output. The default.
;          in    = the frame handed TO DLSS-NR, before the model.
;          split = BOTH, in one backbuffer: the left half is the input, the
;                  right half is the output, and they are THE SAME FRAME, with
;                  a white seam between them. This is the only way to compare
;                  input against output in a game - two runs never contain the
;                  same frame, and an exterior changes underneath you, so a
;                  difference between two captures can never be attributed
;                  cleanly. Nothing about the neural stage or its timing
;                  changes; only the copy into the bridge's backbuffer does.
;          Live: CTRL+ALT+F7 cycles it, and the panel has the same control.
;
; Preset   manual = per-pass values as written above. The default.
;          front  = pass 1 at 2.00, every other pass at 0.10.
;          back   = the LAST active pass at 2.00, every other pass at 0.10.
;          The shape FOLLOWS the pass count: raise Passes and the peak moves
;          with it, so front and back stay a single clean variable while the
;          count is being changed live. Moving any slider or pressing an
;          intensity hotkey returns to manual, so a hand-edited run is never
;          labelled as a preset.
;
; Window   crop  = the P5 behaviour: 1280x720 bordered window, centre crop.
;          match = window AND swapchain at the source size, borderless. One
;                  CopyTextureRegion, 1:1, whole frame, nothing resampled.
;                  Clamped to the monitor if the source is bigger.
;          fit   = borderless at the MONITOR size, swapchain still at source
;                  size, so DXGI scales on presentation. Default. When the
;                  source and the monitor are the same size this is identical
;                  to match and the log says so.
;          The window is placed on the monitor it is already on, at that
;          monitor's origin - not at the virtual desktop's (P7.1).
;          Sized once per stream, on the first frame whose source size is
;          known. Not applied in Profile=1: that run has no on-screen output.
;          The backbuffer format follows the GAME's format in every mode
;          (P7.3); it is not assumed.
;
; Frames   stream bound, 60..100000.
;          0 = NO BOUND: the stream runs until the game closes, and prints no
;          summary. Implemented as a bound nothing reaches, not as a stop and
;          restart, so no feature or texture is ever torn down and rebuilt
;          while the game is live. SESSIONS BEYOND A FEW MINUTES ARE UNTESTED -
;          one development session ended with the game rendering black on both
;          displays after several minutes and the cause was never isolated.
;          Watch GPU load and temperature.
; Neural   0 = transport-only control.
; Profile  1 = measurement run: no on-screen output, no liveness sample.
;          0 also inflates the GPU timestamp tails - the present chain shares
;          GPU 1's queue - so take figures from Profile=1.
; Probes   1 = the hotkey runs the one-shot probe chain INSTEAD of the stream.
; Passes   1..6. DLSS-NR N times per frame on GPU 1, one feature handle each.
;          All handles are created at arm (~150 ms each), so changing the
;          count live costs nothing. LATENCY SCALES WITH PASSES: the bridge
;          window's own frame rate falls as the count climbs while the game's
;          does not, which is the architecture working, not a fault.
;          Changeable live: the panel, or CTRL+ALT+F8/F9/F11 for intensity.
